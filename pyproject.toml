[project]
name = "data-tools"
version = "0.1.0"
description = "A collection of small, independent data-pipeline tools for learning MCP and RAG."
readme = "README.md"
requires-python = ">=3.13"
# Umbrella metapackage: installing `data-tools` pulls in every tool.
# (No code of its own — see bypass-selection below.)
dependencies = [
    "docs-rag",
    "repo-rag",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

# --- uv workspace ---------------------------------------------------------
# Every member is developed together against one lockfile. `uv sync` at the
# root installs all members (and dev deps) editable into one .venv.
[tool.uv.workspace]
members = ["shared", "tools/*"]

# Dev-only: resolve the umbrella's own member deps from the workspace.
# These [tool.uv.sources] entries are NOT written into built wheels — at
# publish time the deps resolve from the index instead. That's the spin-out seam.
[tool.uv.sources]
data-tools-shared = { workspace = true }
docs-rag = { workspace = true }
repo-rag = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
# importlib mode lets each member keep a conventional test layout (e.g. several
# `test_smoke.py`) without __init__.py packages or basename collisions.
addopts = "--import-mode=importlib"
testpaths = [
    "shared/tests",
    "tools/docs-rag/tests",
    "tools/repo-rag/tests",
]
