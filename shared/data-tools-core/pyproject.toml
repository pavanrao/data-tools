[project]
name = "data-tools-core"
version = "0.1.0"
description = "Shared contracts for the data-tools collection: provenance, ledger schema, tool discovery."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dt = "data_tools_core.registry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_tools_core"]
