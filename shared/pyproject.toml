[project]
name = "data-tools-shared"
version = "0.1.0"
description = "Shared, model-pluggable LLM/embeddings interfaces for data-tools, backed by LiteLLM."
requires-python = ">=3.13"
dependencies = [
    "litellm>=1.0",
    "pydantic-settings>=2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dt_shared"]
