[project]
name = "data-tools-ai-sniffer"
version = "0.1.0"
description = "Find the habits that make prose read as machine-written, quote each one, and never guess who wrote it."
requires-python = ">=3.13"
# The linter is standard library only, so a global `uv tool install` needs nothing.
dependencies = []

[project.scripts]
ai-sniffer = "ai_sniffer.cli:main"

[project.entry-points."data_tools.tools"]
ai-sniffer = "ai_sniffer.cli:main"

[project.optional-dependencies]
# `ai-sniffer review` sends the reviewer prompt through the shared model layer.
llm = ["data-tools-core[llm]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_sniffer"]

# One copy of the reviewer prompt: the agent file, shipped inside the package too.
[tool.hatch.build.targets.wheel.force-include]
"agent/ai-sniffer.md" = "ai_sniffer/agent/ai-sniffer.md"

[tool.uv.sources]
data-tools-core = { workspace = true }
