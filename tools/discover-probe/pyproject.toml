[project]
name = "data-tools-discover-probe"
version = "0.1.0"
description = "Ask an MCP server what it is, one negotiation path at a time, and check the claims against what it does."
requires-python = ">=3.13"
dependencies = [
    "data-tools-core",
    # Not an extra: the probe is an MCP client and nothing else. Bounded below
    # 3.0 for the reason D3 records.
    "mcp>=2.2.0,<3",
]

[project.scripts]
discover-probe = "discover_probe.cli:main"

[project.entry-points."data_tools.tools"]
discover-probe = "discover_probe.cli:main"

# Deliberately no data_tools.mcp entry point: this is a client. Giving it a
# server of its own would be complexity with no consumer.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discover_probe"]

# Dev-only: resolve the shared library from the workspace. See docs/000.
[tool.uv.sources]
data-tools-core = { workspace = true }
