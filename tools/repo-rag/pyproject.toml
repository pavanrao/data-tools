[project]
name = "data-tools-repo-rag"
version = "0.1.0"
description = "Ask-your-codebase RAG with AST-aware chunking and file:line citations, exposed as an MCP server."
requires-python = ">=3.13"
dependencies = [
    "data-tools-core",
    "sqlite-vec>=0.1",
    # Not an extra: serving retrieval over MCP is this tool's headline feature,
    # and the SDK is light. Only the model backend is optional.
    #
    # Bounded below 3.0 deliberately. An unbounded ">=1.0" is what let the 2.x
    # rename (FastMCP -> MCPServer) break this tool while the branch sat; the
    # major bound is the part that prevents a repeat, which is what CONVENTIONS
    # r4 asks for. Patch and minor releases of a protocol SDK are left to float
    # so security fixes are not gated on a manual bump.
    "mcp>=2.2.0,<3",
]

[project.optional-dependencies]
llm = ["data-tools-core[llm]"]

[project.scripts]
repo-rag = "repo_rag.cli:main"

[project.entry-points."data_tools.tools"]
repo-rag = "repo_rag.cli:main"

# Advertised so `mcp-gateway` (#16) can mount every installed server behind one
# endpoint without hardcoding this tool.
[project.entry-points."data_tools.mcp"]
repo-rag = "repo_rag.mcp_server:create_server"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_rag"]

# Dev-only: resolve the shared library from the workspace. uv strips
# [tool.uv.sources] from built wheels, so deleting this one block is the entire
# "decouple from the workspace" step when spinning this tool out into its own
# repo. See docs/000_project-organization.md (the spin-out seam).
[tool.uv.sources]
data-tools-core = { workspace = true }
