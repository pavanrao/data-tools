[project]
name = "repo-rag"
version = "0.1.0"
description = "Ask-your-codebase RAG with AST-aware chunking and file:line citations, exposed as an MCP server."
requires-python = ">=3.13"
dependencies = [
    "data-tools-shared>=0.1",
    "sqlite-vec>=0.1",
    "mcp>=1.0",
]

[project.scripts]
repo-rag = "repo_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_rag"]

# Dev-only: use the in-workspace shared library. Delete this single line to
# spin repo-rag out into its own repo (it then resolves the published wheel).
[tool.uv.sources]
data-tools-shared = { workspace = true }
