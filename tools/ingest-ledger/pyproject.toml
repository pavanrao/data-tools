[project]
name = "data-tools-ingest-ledger"
version = "0.1.0"
description = "Reconcile what a document pipeline was given against what it actually read."
requires-python = ">=3.11"
dependencies = [
    "data-tools-core",
]

[project.optional-dependencies]
# The PDF lane delegates page-level silent-drop detection to pdfmux. Pinned
# exactly and confined to probes/pdf.py; without it we fall back to a native
# PyMuPDF probe and say so in the ledger.
pdf = ["pdfmux==1.8.7", "pymupdf>=1.24"]
xlsx = ["openpyxl>=3.1"]
# No docx extra: the DOCX probe reads the OOXML package directly with stdlib
# zipfile + ElementTree, precisely so it can see the parts a library's
# document.paragraphs walk skips.
all = ["data-tools-ingest-ledger[pdf,xlsx]"]

[project.scripts]
ingest-ledger = "ingest_ledger.cli:main"

[project.entry-points."data_tools.tools"]
ingest-ledger = "ingest_ledger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_ledger"]
