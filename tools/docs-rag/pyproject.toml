[project]
name = "docs-rag"
version = "0.1.0"
description = "Q&A over a local folder of documents, with citations to the source file (RAG)."
requires-python = ">=3.13"
dependencies = [
    "data-tools-shared>=0.1",
    "sqlite-vec>=0.1",
    "pypdf>=4",
]

[project.scripts]
docs-rag = "docs_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docs_rag"]

# Dev-only: use the in-workspace shared library. Delete this single line to
# spin docs-rag out into its own repo (it then resolves the published wheel).
[tool.uv.sources]
data-tools-shared = { workspace = true }
